[project]
name = "tripvane-analyst"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "sqlalchemy>=2.0.40",
    "tripvane-core",
]

[project.scripts]
tripvane-analyst = "tripvane_analyst.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
tripvane-core = { workspace = true }
