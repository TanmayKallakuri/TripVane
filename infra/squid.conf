# Egress proxy for a sensor. The sensor sits on an internal Docker network with no route
# out; this proxy is its only way to the internet. It permits HTTPS CONNECT tunnels to
# port 443 of the hosts listed in /etc/squid/allowed-hosts.txt (api.anthropic.com and the
# collector host, written by deploy.sh) and denies everything else.

http_port 3128

acl sensor_net src 172.30.0.0/24
acl CONNECT method CONNECT
acl https_port port 443
# -n: match the requested name only. Without it Squid reverse-resolves IP targets, so an
# address whose PTR record claims an allowed name could get through.
acl allowed_hosts dstdomain -n "/etc/squid/allowed-hosts.txt"

http_access deny !sensor_net
http_access deny !CONNECT
http_access deny !https_port
http_access allow allowed_hosts
http_access deny all

# A tunnel only; nothing is cached and nothing identifies the sensor upstream.
cache deny all
via off
forwarded_for delete
shutdown_lifetime 1 seconds
