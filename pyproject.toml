[tool.uv]
required-version = ">=0.11,<0.12"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib", "--strict-markers"]
